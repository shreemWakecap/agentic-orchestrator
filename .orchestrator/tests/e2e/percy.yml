# Percy.io configuration for visual regression testing
# https://docs.percy.io/docs/cli-configuration

version: 2

# Snapshot configuration
snapshot:
  # Viewport widths for responsive testing
  widths:
    - 1280  # Desktop
    - 768   # Tablet
    - 375   # Mobile

  # Minimum height for snapshots
  min-height: 1024

  # Wait for Percy CSS to be applied
  percy-css: |
    /* Hide dynamic content that causes snapshot diffs */
    [data-percy-hide] {
      visibility: hidden !important;
    }
    /* Disable animations for consistent snapshots */
    *, *::before, *::after {
      animation-duration: 0s !important;
      animation-delay: 0s !important;
      transition-duration: 0s !important;
      transition-delay: 0s !important;
    }

  # Enable JavaScript execution
  enable-javascript: true

# Discovery configuration for asset handling
discovery:
  # Network idle timeout in ms
  network-idle-timeout: 250

  # Disable asset caching for fresh snapshots
  disable-cache: true

  # Allowed hostnames for asset discovery
  allowed-hostnames:
    - localhost

# Upload configuration
upload:
  # Number of files to upload in parallel
  files: 10
