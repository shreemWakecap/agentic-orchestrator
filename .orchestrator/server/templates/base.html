<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SDLC Orchestrator{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .workflow-step { transition: all 0.3s ease; }
        .workflow-step.active { background-color: #3B82F6; color: white; }
        .workflow-step.completed { background-color: #10B981; color: white; }
        .workflow-step.failed { background-color: #EF4444; color: white; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .markdown-content h1 { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; }
        .markdown-content h2 { font-size: 1.25rem; font-weight: bold; margin: 0.75rem 0; }
        .markdown-content h3 { font-size: 1.1rem; font-weight: bold; margin: 0.5rem 0; }
        .markdown-content p { margin: 0.5rem 0; }
        .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; }
        .markdown-content ol { list-style-type: decimal; margin-left: 1.5rem; }
        .markdown-content code { background: #f3f4f6; padding: 0.125rem 0.25rem; border-radius: 0.25rem; }
        .markdown-content pre { background: #1f2937; color: #e5e7eb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }

        /* Generic Side Popup Styles */
        .side-popup-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 40;
        }
        .side-popup-overlay.active { opacity: 1; visibility: visible; }

        .side-popup {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 48rem;
            height: 100%;
            background-color: white;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.1);
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            display: flex;
            flex-direction: column;
        }
        .side-popup.active { transform: translateX(0); }

        .side-popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            background-color: #f9fafb;
        }

        .side-popup-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .side-popup-close {
            padding: 0.5rem;
            border-radius: 0.375rem;
            color: #6b7280;
            transition: background-color 0.2s, color 0.2s;
        }
        .side-popup-close:hover { background-color: #f3f4f6; color: #1f2937; }

        /* Expand/Collapse Animation */
        .expand-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }
        .expand-content.expanded { max-height: 500px; }

        .expand-icon {
            transition: transform 0.3s ease;
        }
        .expand-icon.rotated { transform: rotate(90deg); }

        /* File item hover */
        .file-item {
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .file-item:hover {
            background-color: #f3f4f6;
            transform: translateX(4px);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-xl font-bold text-gray-900">SDLC Orchestrator</a>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="/" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="/plans" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Plans
                        </a>
                        <a href="/runs" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Runs
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-8">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500">
                SDLC Orchestrator v1.0.0
            </p>
        </div>
    </footer>

    <!-- Generic Side Popup Component -->
    <div id="side-popup-overlay" class="side-popup-overlay" onclick="SidePopup.close()"></div>
    <div id="side-popup" class="side-popup">
        <div class="side-popup-header">
            <h2 id="side-popup-title" class="text-lg font-semibold text-gray-900">Title</h2>
            <button onclick="SidePopup.close()" class="side-popup-close">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="side-popup-content" class="side-popup-content">
            <!-- Content loaded dynamically -->
        </div>
    </div>

    <!-- Generic Side Popup JavaScript -->
    <script src="/static/js/side-popup.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
