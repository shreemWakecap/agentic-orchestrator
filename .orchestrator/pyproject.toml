[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-orchestrator"
version = "2.0.0"
description = "Multi-project SDLC orchestration using Claude Code CLI"
readme = "../README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SDLC Orchestrator Team"}
]
keywords = ["sdlc", "orchestration", "claude", "ai", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "rich>=13.0.0",
    "httpx[http2]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "alembic>=1.13.0",
    "gitpython>=3.1.0",
]

[project.scripts]
orch = "cli:main"
sdlc-orchestrator = "cli:main"

[project.urls]
Homepage = "https://github.com/sdlc-orchestrator/sdlc-orchestrator"
Documentation = "https://github.com/sdlc-orchestrator/sdlc-orchestrator#readme"
Repository = "https://github.com/sdlc-orchestrator/sdlc-orchestrator"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["node_modules*", "tests*", "__pycache__*", "*.egg-info*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.ini", "*.html", "*.css", "*.js"]

[project.optional-dependencies]
web = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "blinker>=1.9.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "sdlc-orchestrator[web,dev]",
]
