# Visual Regression Testing with Percy.io
# This workflow runs Percy visual regression tests on push/PR to main branches

name: Visual Regression Tests

on:
  push:
    branches:
      - main
      - master
      - developmet
  pull_request:
    branches:
      - main
      - master
      - developmet

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-tests:
    name: Percy Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python for the orchestrator server
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
        working-directory: .orchestrator

      # Set up Node.js for Playwright and Percy
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .orchestrator/tests/e2e/package-lock.json

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci
        working-directory: .orchestrator/tests/e2e

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: .orchestrator/tests/e2e

      # Start the Python server in the background
      - name: Start orchestrator server
        run: |
          python -m orchestrator.server.app &
          echo $! > /tmp/server.pid
        working-directory: .orchestrator

      # Wait for server to be ready
      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to start..."
          timeout=60
          while ! curl -s http://localhost:8000 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "Server failed to start within timeout"
              exit 1
            fi
            echo "Waiting for server... ($timeout seconds remaining)"
            sleep 2
            timeout=$((timeout - 2))
          done
          echo "Server is ready!"

      # Run Percy visual tests
      - name: Run Percy visual tests
        run: npm run test:visual
        working-directory: .orchestrator/tests/e2e
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          CI: true

      # Stop the server (cleanup)
      - name: Stop orchestrator server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            rm /tmp/server.pid
          fi

      # Upload test artifacts on failure
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .orchestrator/tests/e2e/playwright-report/
          retention-days: 7

      # Upload test traces on failure
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces
          path: .orchestrator/tests/e2e/test-results/
          retention-days: 7
