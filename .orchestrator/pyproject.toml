[project]
name = "sdlc-orchestrator"
version = "1.0.0"
description = "SDLC orchestration using Claude Code CLI"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "httpx[http2]>=0.27.0",
]

[project.optional-dependencies]
mcp = [
    "websockets>=12.0",
    "anthropic>=0.40.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "websockets>=12.0",
    "anthropic>=0.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end (deselect with '-m \"not e2e\"')",
]

[tool.coverage.run]
source = [".orchestrator"]
omit = [".orchestrator/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
